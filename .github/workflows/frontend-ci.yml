name: Project CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Upload dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Type-check and build
        run: npm run build

  mock-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r mock-api/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q mock-api
      - name: Run API smoke tests
        run: |
          cd mock-api
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 > /tmp/mock-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              break
            fi
            sleep 1
          done
          python smoke_test.py
